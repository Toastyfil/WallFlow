<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; media-src file:; script-src 'unsafe-inline'; style-src 'unsafe-inline';" />
    <title>WallFlow</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        cursor: none;
      }
      video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video id="wallflow-video" autoplay loop playsinline preload="auto"></video>
    <script>
      const params = new URLSearchParams(window.location.search)
      const video = document.getElementById('wallflow-video')
      video.muted = params.get('muted') !== '0'
      video.loop = true
      video.src = params.get('src') || ''
      video.addEventListener('canplay', () => video.play().catch(() => undefined), { once: true })
      // Some decoders reject autoplay until the media is fully ready; retry once.
      video.addEventListener('error', () => setTimeout(() => video.play().catch(() => undefined), 1500))
    </script>
  </body>
</html>
